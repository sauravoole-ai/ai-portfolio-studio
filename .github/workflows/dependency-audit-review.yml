name: Dependency audit review

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve dependencies without lifecycle scripts
        run: npm install --ignore-scripts
      - name: Production dependency audit
        shell: bash
        run: |
          npm audit --omit=dev --json > audit.json || true
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("audit.json", "utf8"));
          const meta = report.metadata?.vulnerabilities ?? {};
          console.log("PRODUCTION_AUDIT_COUNTS", JSON.stringify(meta));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log("VULNERABILITY", JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              via: item.via,
              range: item.range,
              fixAvailable: item.fixAvailable
            }));
          }
          NODE
