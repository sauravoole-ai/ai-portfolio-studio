name: Format preview

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx prettier --write AGENTS.md wrangler.jsonc
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-small-files
          path: |
            AGENTS.md
            wrangler.jsonc
