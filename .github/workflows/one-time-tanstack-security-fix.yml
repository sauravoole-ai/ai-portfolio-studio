name: One-time TanStack security fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && contains(github.event.head_commit.message, 'trigger TanStack security fix')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_placeholder
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install patched TanStack Start
        run: npm install @tanstack/react-start@1.168.60 --save-exact --ignore-scripts

      - name: Verify patched dependency chain
        shell: bash
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const rs = lock.packages['node_modules/@tanstack/react-start']?.version;
          const core = lock.packages['node_modules/@tanstack/start-server-core']?.version;
          console.log({ reactStart: rs, startServerCore: core });
          if (rs !== '1.168.60') process.exit(1);
          const parts = String(core || '').split('.').map(Number);
          const ok = parts.length === 3 && (parts[0] > 1 || (parts[0] === 1 && (parts[1] > 169 || (parts[1] === 169 && parts[2] >= 39))));
          if (!ok) process.exit(1);
          NODE

      - name: Verify project
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Commit security fix and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/one-time-tanstack-security-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/one-time-tanstack-security-fix.yml
          git commit -m "fix: patch TanStack Start XSS vulnerability"
          git push origin HEAD:main
